# coturn configuration (TASK-044). Rendered by scripts/render-config.sh. NOT TESTED on a real host.
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=49999
fingerprint
realm=${TURN_REALM}
server-name=${TURN_REALM}
external-ip=${TURN_EXTERNAL_IP}

# Short-lived credentials (TURN REST API): the API hands out username "expiry:identity" and
# password = base64(HMAC-SHA1(secret, username)). No permanent user accounts exist.
use-auth-secret
static-auth-secret=${TURN_SECRET}

# TLS (certificate files mounted at /certs)
cert=/certs/fullchain.pem
pkey=/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# Never let the relay reach internal networks (SSRF / lateral movement)
no-multicast-peers
no-cli
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
# Abuse limits
total-quota=200
user-quota=12
stale-nonce=600
no-software-attribute
log-file=stdout
