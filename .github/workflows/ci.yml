name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published vulnerabilities in unchanged dependencies are noticed.
    - cron: "0 5 * * 1"
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore KSC.MeetingManagement.sln
      - name: NuGet vulnerability audit
        run: |
          dotnet list KSC.MeetingManagement.sln package --vulnerable --include-transitive 2>&1 | tee vulnerability-audit.txt
          if grep -q "has the following vulnerable packages" vulnerability-audit.txt; then
            echo "Vulnerable packages found; see docs/security/dependencies.md" >&2
            exit 1
          fi
      - run: dotnet format KSC.MeetingManagement.sln --verify-no-changes --no-restore
      - run: dotnet build KSC.MeetingManagement.sln -c Release --no-restore
      - run: dotnet test KSC.MeetingManagement.sln -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
      - run: dotnet publish src/KSC.MeetingManagement.Api -c Release -o out/api --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: out/api
